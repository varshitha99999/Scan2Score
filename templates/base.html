<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scan2Score{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: #0d6efd !important;
        }
        .main-content {
            flex: 1;
            padding-top: 20px;
            padding-bottom: 40px;
        }
        footer {
            background-color: #e9ecef;
            padding: 15px 0;
            text-align: center;
            margin-top: auto;
        }
        {% block styles %}{% endblock %}
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">Scan2Score</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/teacher">Teacher Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/paper-generation">Generate Paper</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/paper-correction">Paper Correction</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <div class="container">
            <span class="text-muted">© 2026 Scan2Score. All rights reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
