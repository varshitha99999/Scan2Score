<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Entry System - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .login-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 700px;
            width: 100%;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .login-card.teacher:hover {
            border: 2px solid var(--primary);
        }

        .login-card.student:hover {
            border: 2px solid var(--secondary);
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: all 0.3s ease;
        }

        .login-card.teacher .icon-wrapper {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .login-card.student .icon-wrapper {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .login-card:hover .icon-wrapper {
            transform: scale(1.1) rotate(5deg);
        }

        .login-card h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .login-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .arrow-icon {
            margin-top: 1rem;
            font-size: 1.5rem;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .login-card.teacher .arrow-icon {
            color: var(--primary);
        }

        .login-card.student .arrow-icon {
            color: var(--secondary);
        }

        .login-card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(5px);
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 2rem;
            }

            .login-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa-solid fa-graduation-cap"></i> Marks Entry System</h1>
        <p>Automated Answer Sheet Processing & Grading</p>
    </div>

    <div class="login-container">
        <a href="/teacher" class="login-card teacher">
            <div class="icon-wrapper">
                <i class="fa-solid fa-chalkboard-user"></i>
            </div>
            <h2>Teacher Login</h2>
            <p>Process answer sheets, update marks, and manage student records efficiently</p>
            <div class="arrow-icon">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <a href="/student" class="login-card student">
            <div class="icon-wrapper">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h2>Student Login</h2>
            <p>View your marks, track progress, and access your academic records</p>
            <div class="arrow-icon">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>
    </div>
</body>
</html>
